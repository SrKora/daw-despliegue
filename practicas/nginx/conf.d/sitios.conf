server {
    listen 80;
    server_name escaparate.127.0.0.1.nip.io;

    root /srv/www/escaparate;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json;
 
    location ~* \.(css|js|png|jpg|jpeg|svg|webp)$ {
    expires 7d;
    }

    location /api/ {
        proxy_pass http://app:8080;
    }
}

server {
    listen 80;
    server_name docs.127.0.0.1.nip.io;
    
    root /srv/www/docs;
    index index.html;
    
    location /informes/ {
        autoindex on;
    }
}

server {
    listen 80 default_server;
    server_name _;
    
    return 404;
}
